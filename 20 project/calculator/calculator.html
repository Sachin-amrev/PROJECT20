<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      transition: background-color 0.4s, color 0.4s;
    }

    .dark {
      background-color: #121212;
      color: #fff;
    }

    #darkModeToggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 8px 14px;
      border: none;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.1);
      color: #000;
      font-weight: bold;
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dark #darkModeToggle {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .calculator {
      width: 320px;
      margin: 80px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
      transition: background-color 0.4s;
    }

    .dark .calculator {
      background-color: #1e1e1e;
    }

    .display {
      width: 100%;
      height: 50px;
      font-size: 24px;
      padding: 10px;
      text-align: right;
      border-radius: 10px;
      border: none;
      background: #f9f9f9;
      margin-bottom: 20px;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s, color 0.3s;
    }

    .dark .display {
      background: #333;
      color: #fff;
    }

    .button {
      width: 65px;
      height: 45px;
      margin: 5px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: #4CAF50;
      color: white;
      transition: background-color 0.3s;
    }

    .button:hover {
      background-color: #388e3c;
    }

    .dark .button {
      background-color: #388e3c;
    }

    .dark .button:hover {
      background-color: #2e7d32;
    }
  </style>
</head>
<body>
  <button id="darkModeToggle" onclick="toggleMode()">🌗</button>

  <div class="calculator">
    <input type="text" class="display" id="display" disabled />
    <div class="row">
      <button class="button col-3" onclick="calculate('7')">7</button>
      <button class="button col-3" onclick="calculate('8')">8</button>
      <button class="button col-3" onclick="calculate('9')">9</button>
      <button class="button col-3" onclick="calculate('/')">/</button>
    </div>
    <div class="row">
      <button class="button col-3" onclick="calculate('4')">4</button>
      <button class="button col-3" onclick="calculate('5')">5</button>
      <button class="button col-3" onclick="calculate('6')">6</button>
      <button class="button col-3" onclick="calculate('*')">*</button>
    </div>
    <div class="row">
      <button class="button col-3" onclick="calculate('1')">1</button>
      <button class="button col-3" onclick="calculate('2')">2</button>
      <button class="button col-3" onclick="calculate('3')">3</button>
      <button class="button col-3" onclick="calculate('-')">-</button>
    </div>
    <div class="row">
      <button class="button col-3" onclick="calculate('0')">0</button>
      <button class="button col-3" onclick="calculate('.')">.</button>
      <button class="button col-3" onclick="calculate('=')">=</button>
      <button class="button col-3" onclick="calculate('+')">+</button>
    </div>
    <div class="row">
      <button class="button col-3" onclick="calculate('sin')">sin</button>
      <button class="button col-3" onclick="calculate('cos')">cos</button>
      <button class="button col-3" onclick="calculate('tan')">tan</button>
      <button class="button col-3" onclick="calculate('log')">log</button>
    </div>
    <div class="row">
      <button class="button col-3" onclick="calculate('ln')">ln</button>
      <button class="button col-3" onclick="calculate('e')">e</button>
      <button class="button col-3" onclick="clearDisplay()">C</button>
      <button class="button col-3" onclick="calculate('%')">%</button>
    </div>
  </div>

  <script>
    let display = document.getElementById('display');
    let expression = '';

    function calculate(value) {
      if (value === '=') {
        try {
          let result = eval(
            expression
              .replace(/sin/g, 'Math.sin')
              .replace(/cos/g, 'Math.cos')
              .replace(/tan/g, 'Math.tan')
              .replace(/log/g, 'Math.log10')
              .replace(/ln/g, 'Math.log')
              .replace(/e/g, 'Math.E')
          );
          display.value = result;
          expression = result.toString();
        } catch (e) {
          display.value = 'Error';
          expression = '';
        }
      } else if (['sin', 'cos', 'tan', 'log', 'ln'].includes(value)) {
        if (expression) {
          try {
            let result = eval(
              value
                .replace('sin', 'Math.sin')
                .replace('cos', 'Math.cos')
                .replace('tan', 'Math.tan')
                .replace('log', 'Math.log10')
                .replace('ln', 'Math.log') +
              '(' + expression + ')'
            );
            display.value = result;
            expression = result.toString();
          } catch (e) {
            display.value = 'Error';
            expression = '';
          }
        } else {
          display.value = 'Error';
          expression = '';
        }
      } else {
        expression += value;
        display.value = expression;
      }
    }

    function clearDisplay() {
      display.value = '';
      expression = '';
    }

    function toggleMode() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
