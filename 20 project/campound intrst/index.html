<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compound Interest Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffffff, #f1f5ff);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s, color 0.5s;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      margin: 20px;
      position: relative;
      transition: background 0.5s, color 0.5s;
    }

    h2 {
      text-align: center;
      font-weight: bold;
      margin-bottom: 25px;
      color: #0066cc;
    }

    .form-control,
    .form-select {
      background-color: #f8f9fa;
      border: 1px solid #ccc;
      color: #333;
    }

    .form-control::placeholder {
      color: #999;
    }

    .btn-primary {
      background-color: #0066cc;
      border: none;
    }

    .btn-primary:hover {
      background-color: #004999;
    }

    .mode-toggle {
      position: absolute;
      top: 15px;
      right: 20px;
      background-color: #e0e0e0;
      color: #000;
      border: none;
    }

    #result-text {
      color: #333;
    }

    .dark-mode body {
      background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
      color: #f1f1f1;
    }

    .dark-mode .container {
      background: #1c1c2d;
      color: #f1f1f1;
    }

    .dark-mode .form-control,
    .dark-mode .form-select {
      background-color: #2e2e44;
      color: #fff;
      border-color: #444;
    }

    .dark-mode .btn-primary {
      background-color: #0056b3;
    }

    .dark-mode .mode-toggle {
      background-color: #333;
      color: #fff;
    }

    @media (max-width: 576px) {
      .container {
        padding: 20px;
      }

      h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn mode-toggle" onclick="toggleDarkMode()">Dark🌓</button>
    <h2>Compound Interest Calculator</h2>
    <form>
      <div class="mb-3">
        <label for="principal" class="form-label">Invested Amount</label>
        <input type="number" class="form-control" id="principal" placeholder="e.g. 100000" required>
      </div>
      <div class="mb-3">
        <label for="interestRate" class="form-label">Interest Rate (%)</label>
        <input type="number" class="form-control" id="interestRate" placeholder="e.g. 7.5" required>
      </div>
      <div class="mb-3">
        <label for="timePeriod" class="form-label">Time Period (years)</label>
        <input type="number" class="form-control" id="timePeriod" placeholder="e.g. 5" required>
      </div>
      <div class="mb-3">
        <label for="compoundingFrequency" class="form-label">Compounding Frequency</label>
        <select class="form-select" id="compoundingFrequency" required>
          <option value="1">Annually</option>
          <option value="2">Semi-Annually</option>
          <option value="4">Quarterly</option>
          <option value="12">Monthly</option>
        </select>
      </div>
      <button type="button" class="btn btn-primary w-100" onclick="calculateCompoundInterest()">Calculate</button>
    </form>

    <div id="result" class="mt-4 text-center">
      <p id="result-text" class="fw-bold"></p>
      <canvas id="interestChart"></canvas>
    </div>
  </div>

  <script>
    let interestChart;

    function calculateCompoundInterest() {
      const principal = parseFloat(document.getElementById("principal").value);
      const rate = parseFloat(document.getElementById("interestRate").value) / 100;
      const time = parseFloat(document.getElementById("timePeriod").value);
      const freq = parseInt(document.getElementById("compoundingFrequency").value);

      if (!principal || !rate || !time || !freq) {
        alert("Please fill in all fields correctly.");
        return;
      }

      const amount = principal * Math.pow(1 + rate / freq, freq * time);
      const interest = amount - principal;

      document.getElementById("result-text").innerHTML = `
        <strong>Interest Earned:</strong> ₹${interest.toFixed(2)}<br>
        <strong>Total Amount:</strong> ₹${amount.toFixed(2)}
      `;

      if (interestChart) interestChart.destroy();

      const ctx = document.getElementById("interestChart").getContext("2d");
      interestChart = new Chart(ctx, {
        type: "pie",
        data: {
          labels: ["Invested Amount", "Interest Earned"],
          datasets: [{
            data: [principal, interest],
            backgroundColor: ["#007bff", "#ff4d6d"]
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
