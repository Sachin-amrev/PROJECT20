<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f9f9f9, #e6f0ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s, color 0.5s;
    }

    .container {
      max-width: 600px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      transition: background 0.5s, color 0.5s;
      animation: fadeInUp 1s ease;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(to right, #007bff, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    .dark-mode {
      background: #121212 !important;
      color: #f1f1f1;
    }

    .dark-mode .container {
      background: #1e1e1e;
      color: #f1f1f1;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .dark-mode input,
    .dark-mode .form-control {
      background-color: #333;
      color: #f1f1f1;
      border-color: #555;
    }

    .dark-mode canvas {
      background-color: #1e1e1e;
    }

    #result-details {
      display: none;
      margin-top: 20px;
    }

    .mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      animation: slideInRight 1.2s ease;
    }

    .btn {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeIn 1s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Make chart canvas responsive */
    canvas {
      width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <button class="btn btn-sm btn-outline-dark mode-toggle" onclick="DarkMode()">🌓 Dark Mode</button>
  <div class="container">
    <h2>💸 EMI Calculator</h2>
    <form id="emi-form">
      <div class="mb-3">
        <label for="loan-amount" class="form-label">Loan Amount (₹)</label>
        <input type="number" class="form-control" id="loan-amount" placeholder="e.g. 500000" />
      </div>
      <div class="mb-3">
        <label for="interest-rate" class="form-label">Interest Rate (%)</label>
        <input type="number" class="form-control" id="interest-rate" placeholder="e.g. 7.5" />
      </div>
      <div class="mb-3">
        <label for="loan-tenure" class="form-label">Loan Tenure (Years)</label>
        <input type="number" class="form-control" id="loan-tenure" placeholder="e.g. 5" />
      </div>
      <button type="button" class="btn btn-primary w-100" id="calculate-emi">Calculate EMI</button>
    </form>

    <div id="result-details" class="mt-4">
      <h5 class="text-success">📊 EMI Breakdown</h5>
      <p id="emi-result"></p>
      <p id="total-interest"></p>
      <p id="total-payment"></p>
      <canvas id="emi-chart"></canvas>
    </div>
  </div>

  <script>
    const calculateButton = document.getElementById('calculate-emi');
    const emiResult = document.getElementById('emi-result');
    const totalInterestEl = document.getElementById('total-interest');
    const totalPaymentEl = document.getElementById('total-payment');
    const resultDetails = document.getElementById('result-details');
    let emiChart;

    calculateButton.addEventListener('click', () => {
      const principal = parseFloat(document.getElementById('loan-amount').value);
      const annualRate = parseFloat(document.getElementById('interest-rate').value);
      const years = parseFloat(document.getElementById('loan-tenure').value);

      if (!principal || !annualRate || !years) return alert("Please fill all fields");

      const monthlyRate = annualRate / 12 / 100;
      const months = years * 12;

      const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) / 
                  (Math.pow(1 + monthlyRate, months) - 1);
      const totalPayment = emi * months;
      const totalInterest = totalPayment - principal;

      emiResult.textContent = `Your Monthly EMI is: ₹${emi.toFixed(2)}`;
      totalInterestEl.textContent = `Total Interest: ₹${totalInterest.toFixed(2)}`;
      totalPaymentEl.textContent = `Total Payment: ₹${totalPayment.toFixed(2)}`;
      resultDetails.style.display = 'block';

      if (emiChart) emiChart.destroy();
      const ctx = document.getElementById('emi-chart').getContext('2d');
      emiChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Principal', 'Interest'],
          datasets: [{
            data: [principal, totalInterest],
            backgroundColor: ['#007bff', '#ff6384']
          }]
        },
        options: {
          responsive: true
        }
      });
    });

    function DarkMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
